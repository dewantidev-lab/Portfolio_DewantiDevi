<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - Dewanti</title>

    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-yellow-50 text-gray-800">

    <nav class="bg-white shadow-sm">
        <div class="max-w-6xl mx-auto px-6 py-5">

            <div class="flex flex-wrap justify-between items-center gap-4">

                <a href="index.html"
                    class="text-2xl md:text-3xl font-bold text-pink-500">
                    Dewanti
                </a>

                <div class="flex flex-wrap items-center gap-5 md:gap-8 text-sm md:text-base">

                    <a href="index.html"
                        class="text-gray-700 hover:text-pink-500 transition duration-300">
                        Home
                    </a>

                    <a href="about.html"
                        class="text-gray-700 hover:text-pink-500 transition duration-300">
                        About
                    </a>

                    <a href="education.html"
                        class="text-gray-700 hover:text-pink-500 transition duration-300">
                        Education
                    </a>

                    <a href="organization.html"
                        class="text-gray-700 hover:text-pink-500 transition duration-300">
                        Organization
                    </a>

                    <a href="contact.html"
                        class="text-pink-500 font-semibold border-b-2 border-pink-400 pb-1">
                        Contact
                    </a>

                    <a href="todolist.html"
                        class="text-gray-700 hover:text-pink-500 transition duration-300">
                        JavaScript Project
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <section class="relative overflow-hidden min-h-[calc(100vh-80px)] flex items-center">

        <div class="absolute -top-24 -left-24 w-64 h-64
            bg-pink-200 rounded-full opacity-50">
        </div>

        <div class="absolute -bottom-32 -right-20 w-80 h-80
            bg-pink-200 rounded-full opacity-50">
        </div>


        <div class="relative max-w-5xl mx-auto px-6 py-16 w-full">

            <div class="text-center mb-12">
                <p class="text-pink-500 font-semibold text-lg mb-2">
                    Let's Connect ♡
                </p>

                <h1 class="text-4xl md:text-5xl font-bold text-gray-700 mb-4">
                    Contact Me
                </h1>
            </div>

            <div class="max-w-2xl mx-auto">

                <form id="contactForm"
                    class="bg-white rounded-3xl
                    border-2 border-pink-100
                    shadow-lg p-6 md:p-8">

                    <div class="mb-5">

                        <label for="nama"
                            class="block text-gray-700 font-semibold mb-2">
                            Nama
                        </label>

                        <input type="text"
                            id="nama"
                            name="nama"
                            placeholder="Masukkan nama Anda"
                            class="w-full border border-gray-200
                            rounded-xl px-4 py-3
                            bg-yellow-50
                            focus:outline-none
                            focus:ring-2 focus:ring-pink-300
                            focus:border-pink-300
                            transition duration-300">

                    </div>

                    <div class="mb-5">

                        <label for="email"
                            class="block text-gray-700 font-semibold mb-2">
                            Email
                        </label>

                        <input type="email"
                            id="email"
                            name="email"
                            placeholder="Masukkan email Anda"
                            class="w-full border border-gray-200
                            rounded-xl px-4 py-3
                            bg-yellow-50
                            focus:outline-none
                            focus:ring-2 focus:ring-pink-300
                            focus:border-pink-300
                            transition duration-300">
                    </div>

                    <div class="mb-6">
                        <label for="pesan"
                            class="block text-gray-700 font-semibold mb-2">
                            Pesan
                        </label>

                        <textarea
                            id="pesan"
                            name="pesan"
                            rows="5"
                            placeholder="Tulis pesan Anda..."
                            class="w-full border border-gray-200
                            rounded-xl px-4 py-3
                            bg-yellow-50
                            focus:outline-none
                            focus:ring-2 focus:ring-pink-300
                            focus:border-pink-300
                            transition duration-300"></textarea>
                    </div>

                    <button type="submit"
                        class="w-full bg-pink-400 text-white
                        font-semibold py-3 rounded-full
                        shadow-md shadow-pink-200
                        hover:bg-pink-500
                        hover:scale-[1.02]
                        transition duration-300">
                        Kirim Pesan →
                    </button>

                    <div class="text-center text-pink-300 text-2xl mt-6">
                        ♡
                    </div>

               </form>
            </div>
        </div>
    </section>

<script src="./script.js"></script>

</body>
</html>
